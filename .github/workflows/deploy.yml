# Build the React site and upload it to the web server on every push to main.
# Credentials live in GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER      e.g. w0123456.kasserver.com
#   FTP_USERNAME    FTP user (best: one limited to the site's folder)
#   FTP_PASSWORD
#   FTP_SERVER_DIR  target folder on the server, ending in "/". For an FTP user that
#                   is limited to the site folder (All-Inkl), use ./ (not /).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# never run two uploads at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # pinned: "ubuntu-latest" moves to a new Ubuntu version from time to time
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Fail fast with a clear message if a secret is missing (they must be
      # *repository* secrets under Settings → Secrets and variables → Actions → Secrets).
      - name: Check deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions → Secrets (not Variables, not an Environment)."
            exit 1
          fi
          case "$FTP_SERVER_DIR" in */) ;; *) echo "::error::FTP_SERVER_DIR must end with a slash, e.g. ./ or /upperlatives.com/"; exit 1 ;; esac
          echo "All deploy secrets are set."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # uses .env + .env.production (content from https://wp.upperlatives.com)
      - run: npm run build

      # Uploads only files that changed since the last deploy (it keeps a small
      # .ftp-deploy-sync-state.json on the server) and removes deleted ones.
      - name: Upload dist/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # full FTP conversation in the log, so failures show the exact command
          log-level: verbose
